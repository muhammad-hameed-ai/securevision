#
# SecureVision v3 — single source of truth for every dependency version.
#
# Module build scripts MUST reference aliases from this catalog. A hardcoded
# version string in any `build.gradle.kts` is a review-blocking defect.
#

[versions]
# --- Build toolchain -------------------------------------------------------
agp = "8.6.1"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
googleServices = "4.4.2"
javaVersion = "17"

# --- SDK levels ------------------------------------------------------------
compileSdk = "34"
minSdk = "26"
targetSdk = "34"

# --- AndroidX core ---------------------------------------------------------
androidxCore = "1.13.1"
androidxActivity = "1.9.3"
androidxLifecycle = "2.8.6"
androidxNavigation = "2.8.3"
androidxDatastore = "1.1.1"
androidxRoom = "2.6.1"

# --- Compose ---------------------------------------------------------------
composeBom = "2024.10.01"

# --- DI --------------------------------------------------------------------
hilt = "2.52"
hiltNavigationCompose = "1.2.0"

# --- Async -----------------------------------------------------------------
coroutines = "1.9.0"

# --- Media / camera --------------------------------------------------------
camerax = "1.3.4"
media3 = "1.4.1"
coil = "2.7.0"

# --- On-device ML ----------------------------------------------------------
mlkitFaceDetection = "16.1.6"
tensorflowLite = "2.16.1"
tensorflowLiteSupport = "0.4.4"

# --- Firebase (retained for later phases; the login account is now offline) --
firebaseBom = "33.5.1"

# --- Security --------------------------------------------------------------
# at.favre.lib rather than org.mindrot:jbcrypt, which has had no release since
# 2017. This one is maintained, Android-targeted, and takes char[] rather than
# String so the password is not pinned in the string pool until GC.
bcrypt = "0.10.2"

# --- Test ------------------------------------------------------------------
junit = "4.13.2"
turbine = "1.1.0"
mockk = "1.13.13"
androidxTestExtJunit = "1.2.1"
androidxTestEspresso = "3.6.1"
# Supplies an Android Context on the JVM so in-memory Room DAO tests run inside
# `gradlew build` instead of requiring a connected device.
robolectric = "4.14.1"

[libraries]
# --- AndroidX core ---------------------------------------------------------
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigation" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "androidxDatastore" }

# --- Compose (versions come from the BOM) ----------------------------------
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

# --- Room ------------------------------------------------------------------
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "androidxRoom" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "androidxRoom" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "androidxRoom" }

# --- Hilt ------------------------------------------------------------------
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# --- Coroutines ------------------------------------------------------------
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# --- CameraX ---------------------------------------------------------------
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
androidx-camera-video = { group = "androidx.camera", name = "camera-video", version.ref = "camerax" }

# --- Media3 / ExoPlayer ----------------------------------------------------
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
androidx-media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }

# --- Image loading ---------------------------------------------------------
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
coil-video = { group = "io.coil-kt", name = "coil-video", version.ref = "coil" }

# --- On-device ML ----------------------------------------------------------
mlkit-face-detection = { group = "com.google.mlkit", name = "face-detection", version.ref = "mlkitFaceDetection" }
tensorflow-lite = { group = "org.tensorflow", name = "tensorflow-lite", version.ref = "tensorflowLite" }
tensorflow-lite-gpu = { group = "org.tensorflow", name = "tensorflow-lite-gpu", version.ref = "tensorflowLite" }
# Holds GpuDelegateFactory and its nested Options.GpuBackend enum. tensorflow-lite-gpu
# references those types but does not bring this artifact in transitively, so without
# it the GPU delegate is a NoClassDefFoundError waiting to happen at runtime.
tensorflow-lite-gpu-api = { group = "org.tensorflow", name = "tensorflow-lite-gpu-api", version.ref = "tensorflowLite" }
tensorflow-lite-support = { group = "org.tensorflow", name = "tensorflow-lite-support", version.ref = "tensorflowLiteSupport" }
tensorflow-lite-gpu-delegate-plugin = { group = "org.tensorflow", name = "tensorflow-lite-gpu-delegate-plugin", version.ref = "tensorflowLiteSupport" }

# --- Firebase --------------------------------------------------------------
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }

# --- Security --------------------------------------------------------------
bcrypt = { group = "at.favre.lib", name = "bcrypt", version.ref = "bcrypt" }

# --- Test ------------------------------------------------------------------
junit = { group = "junit", name = "junit", version.ref = "junit" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
mockk-android = { group = "io.mockk", name = "mockk-android", version.ref = "mockk" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidxTestEspresso" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

# --- Gradle plugin artifacts, consumed by build-logic convention plugins ----
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compiler-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }

[bundles]
compose-core = [
    "androidx-compose-foundation",
    "androidx-compose-material3",
    "androidx-compose-material-icons-extended",
    "androidx-compose-runtime",
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview",
]
camerax = [
    "androidx-camera-core",
    "androidx-camera-camera2",
    "androidx-camera-lifecycle",
    "androidx-camera-view",
    "androidx-camera-video",
]
media3 = [
    "androidx-media3-exoplayer",
    "androidx-media3-ui",
    "androidx-media3-common",
]
tensorflow-lite = [
    "tensorflow-lite",
    "tensorflow-lite-gpu",
    "tensorflow-lite-gpu-api",
    "tensorflow-lite-support",
    "tensorflow-lite-gpu-delegate-plugin",
]
unit-test = [
    "junit",
    "mockk",
    "turbine",
    "kotlinx-coroutines-test",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }

# --- Convention plugins defined in build-logic/ ----------------------------
securevision-android-application = { id = "securevision.android.application" }
securevision-android-library = { id = "securevision.android.library" }
securevision-android-compose = { id = "securevision.android.compose" }
securevision-android-hilt = { id = "securevision.android.hilt" }
securevision-android-firebase = { id = "securevision.android.firebase" }
securevision-android-room = { id = "securevision.android.room" }
securevision-jvm-library = { id = "securevision.jvm.library" }
