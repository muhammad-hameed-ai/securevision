# SecureVision v3 — build-wide Gradle settings.

# Give the Kotlin/KSP/AGP toolchain enough headroom for a 19-module build.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Module graph is wide and mostly independent, so parallel execution pays off.
org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache is verified working with this toolchain (AGP 8.6 + KSP + Hilt).
org.gradle.configuration-cache=true

# AndroidX only; no support-library translation.
android.useAndroidX=true

# Each module gets its own R class — required for a clean multi-module graph.
android.nonTransitiveRClass=true

# BuildConfig is opt-in per module (the application module enables it).
android.defaults.buildfeatures.buildconfig=false

kotlin.code.style=official
ksp.incremental=true
